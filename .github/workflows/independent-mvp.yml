name: Independent MVP checks
on:
  push:
    branches: [amnko-hse-independent-mvp]
    paths: ['independent-mvp/**', '.github/workflows/independent-mvp.yml']
  pull_request:
    branches: [amnko-hse-independent-mvp]
    paths: ['independent-mvp/**', '.github/workflows/independent-mvp.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: independent-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
